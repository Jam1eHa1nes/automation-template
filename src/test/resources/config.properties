# ============================================================
# Test Configuration
# ============================================================
# All values can be overridden at runtime with system properties:
#   mvn test -Dbrowser=firefox -Dheadless=true

# Browser: chromium | firefox | webkit
browser=chromium

# Run tests without a visible browser window
headless=false

# Base URL for your application under test
base.url=https://www.example.com

# Record a video of each test (saved to target/videos/, attached to Allure report)
video.enabled=false

# Record all network requests/responses as a HAR file (saved to target/har/, attached to Allure report)
# Also logs live request/response lines to the console during the run
network.har.enabled=false
